[package]
name = "wake-daemon"
description = "Wake daemon: JSON-RPC over a Unix socket, compactions and agents in SQLite (ADR-011)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wake.workspace = true
portable-pty = "0.9.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", default-features = false, features = ["formatting"] }

[lints]
workspace = true
