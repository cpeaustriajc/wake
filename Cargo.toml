[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]
# Core crates only: `cargo test`, `cargo clippy` and friends skip apps/wake-window,
# which needs a macOS GPUI build (`just window`).
default-members = ["crates/wake"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
repository = "https://github.com/cpeaustriajc/wake"

[workspace.dependencies]
wake = { path = "crates/wake", version = "=0.1.0" }

# GPUI lives in the Zed monorepo until zed-industries/gpui ships code (ADR-010).
# Cargo.lock holds the commit; a regular pull request bumps it.
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed" }
gpui_platform = { version = "0.1.0", git = "https://github.com/zed-industries/zed", features = ["font-kit"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
missing_assert_message = "warn"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"

undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
or_fun_call = "warn"
set_contains_or_insert = "warn"
rc_buffer = "warn"

exhaustive_enums = "warn"

string_add = "warn"
wildcard_imports = "warn"

dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
